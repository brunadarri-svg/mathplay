name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Publicar no servidor
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Validar e configurar conexão MySQL
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          for name in DB_HOST DB_PORT DB_NAME DB_USER DB_PASS; do
            if [ -z "${!name}" ]; then
              echo "::error::O segredo $name está ausente ou vazio nas configurações do GitHub."
              exit 1
            fi
          done

          if ! [[ "$DB_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::O segredo DB_PORT deve conter apenas números."
            exit 1
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path

          config_path = Path("config.php")
          config = config_path.read_text()
          for name in ("HOST", "PORT", "NAME", "USER", "PASS"):
              value = os.environ[f"DB_{name}"]
              escaped_value = value.replace("\\", "\\\\").replace("'", "\\'")
              config = config.replace(f"__DB_{name}__", escaped_value)
          config_path.write_text(config)
          PY

      - name: Publicar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /menteturbo.totalh.net/htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/database/**
